[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "repotray"
version = "0.1.0"
description = "Tray indicator that shows which of your local git clones have work to push or pull"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE", "src/repotray/icons/data/LICENSE-octicons"]
requires-python = ">=3.11"
authors = [{ name = "Andreas Bonelli" }]
keywords = ["git", "tray", "indicator", "cinnamon", "status", "repositories"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: X11 Applications :: GTK",
  "Environment :: Win32 (MS Windows)",
  "Intended Audience :: Developers",
  "Operating System :: POSIX :: Linux",
  "Operating System :: MacOS",
  "Operating System :: Microsoft :: Windows",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Version Control :: Git",
  "Topic :: Desktop Environment",
]
dependencies = [
  "PySide6-Essentials>=6.8; sys_platform == 'win32'",
  "pystray>=0.19; sys_platform == 'darwin'",
  "Pillow>=9; sys_platform == 'darwin' or sys_platform == 'win32'",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6", "shapely>=2", "svgpathtools>=1.6", "build", "twine"]
pystray = ["pystray>=0.19", "Pillow>=9"]
qt = ["PySide6-Essentials>=6.8", "Pillow>=9"]

[project.scripts]
repotray = "repotray.cli:main"

[project.gui-scripts]
# Windows: starts the tray without a console window (autostart uses it).
repotrayw = "repotray.cli:main"

[project.urls]
Homepage = "https://github.com/ymihere/repotray"
Source = "https://github.com/ymihere/repotray"
Issues = "https://github.com/ymihere/repotray/issues"
Changelog = "https://github.com/ymihere/repotray/blob/main/CHANGELOG.md"

[tool.hatch.build.targets.wheel]
packages = ["src/repotray"]

[tool.hatch.build.targets.sdist]
include = [
  "src/repotray",
  "tests",
  "tools",
  "scripts",
  "docs",
  "README.md",
  "LICENSE",
  "CHANGELOG.md",
  "SPEC.md",
]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.format]
# Markdown code blocks are illustrative (SPEC), not formatted source.
exclude = ["*.md"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = [
  "integration: uses real git processes in a temporary directory",
  "gui: needs a display and REPOTRAY_GUI_TESTS=1 (Qt tests run offscreen without it)",
  "conformance: backend conformance suite (REPOTRAY_BACKEND selects the backend)",
]
