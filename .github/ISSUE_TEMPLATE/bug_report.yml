name: Bug report
description: Something does not work as described
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did you do, what did you expect, what happened instead?
    validations:
      required: true
  - type: textarea
    id: doctor
    attributes:
      label: Output of `repotray doctor`
      description: Remove repository names you do not want to share.
      render: text
    validations:
      required: true
  - type: textarea
    id: log
    attributes:
      label: Relevant log lines
      description: From `~/.local/state/repotray/repotray.log`, or run `repotray tray -v`.
      render: text
  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots
      description: If it is visual. `repotray tray --demo` avoids showing your own repositories.
